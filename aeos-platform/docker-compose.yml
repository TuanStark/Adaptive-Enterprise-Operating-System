# ====================================
# AEOS Platform — Docker Compose (Local Development)
# ====================================
# Khởi chạy: docker compose up -d
# Tắt: docker compose down

services:
  # ── PostgreSQL 16 ──
  postgres:
    image: postgres:16-alpine
    container_name: aeos-postgres
    environment:
      POSTGRES_DB: aeos_dev
      POSTGRES_USER: aeos
      POSTGRES_PASSWORD: aeos_secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeos -d aeos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 ──
  redis:
    image: redis:7-alpine
    container_name: aeos-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft mode — Không cần Zookeeper) ──
  kafka:
    image: apache/kafka:3.8.0
    container_name: aeos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # ── MinIO (S3 Compatible Object Storage) ──
  minio:
    image: minio/minio
    container_name: aeos-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  # ── Mailhog (Email Testing) ──
  mailhog:
    image: mailhog/mailhog
    container_name: aeos-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (xem email test)

volumes:
  pgdata:
  redisdata:
  miniodata:
