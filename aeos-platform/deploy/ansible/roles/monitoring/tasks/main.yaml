---
- name: Add Prometheus Helm repo
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Add Grafana Helm repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    name: monitoring
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    create_namespace: true
    wait: true
    timeout: 15m0s
    values:
      grafana:
        adminPassword: "{{ vault_grafana_admin_password | default('admin') }}"
        persistence:
          enabled: true
          size: 5Gi
          storageClassName: longhorn
        ingress:
          enabled: true
          ingressClassName: nginx
          hosts:
            - grafana.{{ aeos_domain }}
          tls:
            - secretName: grafana-tls
              hosts:
                - grafana.{{ aeos_domain }}
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
      prometheus:
        prometheusSpec:
          retention: 15d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                resources:
                  requests:
                    storage: 20Gi
      alertmanager:
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: longhorn
                resources:
                  requests:
                    storage: 2Gi
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Install Loki Stack
  kubernetes.core.helm:
    name: loki
    chart_ref: grafana/loki-stack
    release_namespace: monitoring
    wait: true
    values:
      loki:
        persistence:
          enabled: true
          size: 20Gi
          storageClassName: longhorn
      promtail:
        enabled: true
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Install Tempo
  kubernetes.core.helm:
    name: tempo
    chart_ref: grafana/tempo
    release_namespace: monitoring
    wait: true
    values:
      persistence:
        enabled: true
        size: 10Gi
        storageClassName: longhorn
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
