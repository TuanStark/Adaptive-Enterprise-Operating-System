---
- name: Disable swap
  ansible.builtin.command: swapoff -a
  changed_when: true

- name: Remove swap from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Set kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/k8s.conf
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.ipv4.conf.all.forwarding", value: "1" }
    - { key: "net.core.somaxconn", value: "32768" }
    - { key: "net.ipv4.tcp_max_syn_backlog", value: "32768" }
    - { key: "vm.max_map_count", value: "262144" }

- name: Configure UFW firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "6443", proto: tcp }
    - { port: "10250", proto: tcp }
    - { port: "8472", proto: udp }
    - { port: "51820", proto: udp }
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "2379:2380", proto: tcp }
  when: ansible_facts['os_family'] == "Debian"
  ignore_errors: true

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
      - open-iscsi
      - nfs-common
      - jq
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Enable and start iscsid (Longhorn requirement)
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true
