---
- name: Add Longhorn Helm repo
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Install Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: longhorn-system
    create_namespace: true
    wait: true
    timeout: 10m0s
    values:
      defaultSettings:
        defaultReplicaCount: "{{ longhorn_replica_count }}"
        storageMinimalAvailablePercentage: "{{ longhorn_storage_min_available_pct }}"
        backupTarget: "s3://aeos-backups@minio/"
        backupTargetCredentialSecret: minio-backup-creds
        autoSalvage: true
        nodeDownPodDeletionPolicy: delete-statefulset-pod
        createDefaultDiskLabeledNodes: true
      persistence:
        defaultClass: true
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
        reclaimPolicy: Retain
      ingress:
        enabled: true
        ingressClassName: nginx
        host: longhorn.{{ aeos_domain }}
        tls: true
        tlsSecret: longhorn-tls
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"

- name: Wait for Longhorn to be ready
  kubernetes.core.k8s_info:
    kind: DaemonSet
    namespace: longhorn-system
    name: longhorn-manager
  register: longhorn_ds
  until: >
    longhorn_ds.resources | length > 0 and
    longhorn_ds.resources[0].status.numberReady == longhorn_ds.resources[0].status.desiredNumberScheduled
  retries: 30
  delay: 10
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
