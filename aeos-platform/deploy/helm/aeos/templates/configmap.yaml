apiVersion: v1
kind: ConfigMap
metadata:
  # Tên ConfigMap duy nhất cho bản release
  name: {{ include "aeos.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aeos.labels" . | nindent 4 }}
data:
  # ── CẤU HÌNH RUNTIME ỨNG DỤNG ──
  NODE_ENV: {{ .Values.api.env.NODE_ENV | default "production" | quote }}
  PORT: {{ .Values.api.port | quote }}
  
  # ── THÔNG TIN DATABASE (HOST LẤY ĐỘNG DỰA VÀO PGBOUNCER) ──
  DATABASE_HOST: {{ include "aeos.databaseHost" . | quote }}
  DATABASE_PORT: {{ .Values.database.port | quote }}
  DATABASE_NAME: {{ .Values.database.name | quote }}
  
  # Kích thước connection pool ứng dụng: Giảm xuống 5 nếu có PgBouncer gánh tải, tăng lên 10 nếu nối trực tiếp DB
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: {{ if .Values.pgbouncer.enabled }}"5"{{ else }}"10"{{ end }}

  # ── THÔNG TIN CACHE REDIS ──
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_TLS_ENABLED: {{ .Values.redis.tls | quote }}

  # ── OBSERVABILITY & CORS ──
  LOG_LEVEL: {{ .Values.api.env.LOG_LEVEL | default "info" | quote }}
  METRICS_ENABLED: "true"
  FRONTEND_URL: {{ .Values.api.env.FRONTEND_URL | default "https://app.aeos.local" | quote }}

  # ── DYNAMIC EXTRA ENVIRONMENT VARIABLES LOOP ──
  # Quét tự động nạp mọi biến custom khác do người dùng cấu hình trong values.yaml
  {{- range $key, $value := .Values.api.env }}
  {{- if not (has $key (list "NODE_ENV" "PORT" "LOG_LEVEL" "FRONTEND_URL")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
