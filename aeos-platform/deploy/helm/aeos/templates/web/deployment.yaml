apiVersion: apps/v1
kind: Deployment
metadata:
  # Tên Deployment Frontend Web: <fullname>-web
  name: {{ include "aeos.fullname" . }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aeos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  # Số lượng Pod chạy Next.js frontend
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "aeos.web.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "aeos.web.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
              protocol: TCP
          env:
            # Truyền URL của API Backend để client/SSR gọi dữ liệu
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.api.env.NEXT_PUBLIC_API_URL | default "http://aeos-api/api/v1" | quote }}
          
          # ── HEALTH CHECKS CHO NEXT.JS (KIỂM TRA HTTP GET ROOT /) ──
          livenessProbe:
            httpGet:
              path: {{ .Values.web.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.web.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.web.probes.readiness.failureThreshold }}

          # Giới hạn tài nguyên CPU và Memory cho Next.js Pod
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}

          # Bảo mật container: Chạy non-root, khóa hệ thống file read-only
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# ── SERVICE CLUSTERIP CHO WEB FRONTEND ──
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aeos.fullname" . }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aeos.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    # Lắng nghe port 80 và chuyển tiếp vào port 3000 của Next.js
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aeos.web.selectorLabels" . | nindent 4 }}
