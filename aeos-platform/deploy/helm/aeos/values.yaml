# Base values — shared across all environments.
# Override per-environment via values-{env}.yaml

global:
  namespace: aeos
  imageRegistry: ghcr.io/tuanstark/aeos

# ── API ──
api:
  replicaCount: 2
  image:
    repository: ghcr.io/tuanstark/aeos/api
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPU: 70
    targetMemory: 80
  keda:
    enabled: false
    redisQueue: ""
    redisQueueThreshold: 10
  probes:
    startup:
      path: /api/v1/health/startup
      failureThreshold: 30
      periodSeconds: 5
    liveness:
      path: /api/v1/health/liveness
      periodSeconds: 15
      failureThreshold: 3
      timeoutSeconds: 5
    readiness:
      path: /api/v1/health/readiness
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5
  env: {}
  preStopSleepSeconds: 15
  terminationGracePeriodSeconds: 45

# ── Web (Next.js) ──
web:
  replicaCount: 2
  image:
    repository: ghcr.io/tuanstark/aeos/web
    tag: latest
    pullPolicy: IfNotPresent
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  probes:
    liveness:
      path: /
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      periodSeconds: 10
      failureThreshold: 3

# ── PgBouncer ──
pgbouncer:
  enabled: true
  replicaCount: 2
  image:
    repository: bitnami/pgbouncer
    tag: "1.22.0"
  poolMode: transaction
  maxClientConn: 200
  defaultPoolSize: 20
  minPoolSize: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Database ──
database:
  external: false
  host: aeos-postgres-rw
  port: 5432
  name: aeos
  user: aeos
  existingSecret: aeos-db-credentials
  secretPasswordKey: password

# ── Redis ──
redis:
  external: false
  host: redis-master
  port: 6379
  existingSecret: ""
  secretPasswordKey: redis-password
  tls: false

# ── Ingress ──
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: api.aeos.local
      paths:
        - path: /
          pathType: Prefix
          service: api
    - host: app.aeos.local
      paths:
        - path: /
          pathType: Prefix
          service: web
  tls: []

# ── Secrets ──
secrets:
  provider: sealed-secrets
  existingSecret: aeos-secrets

# ── Service Account ──
serviceAccount:
  create: true
  annotations: {}
  name: aeos-api

# ── Network Policy ──
networkPolicy:
  enabled: true

# ── Pod Disruption Budget ──
pdb:
  enabled: true
  minAvailable: 1

# ── Resource Quota ──
resourceQuota:
  enabled: false
  cpu: "8"
  memory: 16Gi
  pods: "50"

# ── Priority Class ──
priorityClass:
  enabled: false
  value: 1000000

# ── Migration ──
migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
