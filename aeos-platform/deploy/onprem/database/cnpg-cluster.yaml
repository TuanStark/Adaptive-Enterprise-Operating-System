apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: aeos-postgres
  namespace: aeos
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      log_min_duration_statement: "500"
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"

  storage:
    size: 50Gi
    storageClass: longhorn

  superuserSecret:
    name: aeos-postgres-superuser

  bootstrap:
    initdb:
      database: aeos
      owner: aeos
      secret:
        name: aeos-db-credentials

  backup:
    barmanObjectStore:
      destinationPath: "s3://aeos-backups/postgres/"
      endpointURL: "http://minio.minio:9000"
      s3Credentials:
        accessKeyId:
          name: backup-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-s3-creds
          key: SECRET_ACCESS_KEY
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

  affinity:
    topologyKey: kubernetes.io/hostname
